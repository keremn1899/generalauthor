[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-author"
version = "0.1.0"
description = "Construct and maintain purpose-fit ontologies called Worlds"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kerem" }]
keywords = ["ontology", "semantic-data", "agents", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["starlette>=0.37,<1", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
author = "ontology_author.world.cli:main"

[project.urls]
Homepage = "https://github.com/keremn1899/ontology-author"
Repository = "https://github.com/keremn1899/ontology-author"
Issues = "https://github.com/keremn1899/ontology-author/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ontology_author*",
]
exclude = [
    "tests*",
    "examples*",
    "demo*",
    "tools*",
    "archive*",
    "data*",
    "scratch*",
    "lib*",
]

[tool.setuptools.package-data]
"ontology_author.world" = ["CAPABILITY.md", "static/**/*"]
